# Feature sets: named groups of TOP-LEVEL packages to install during offline-install
# verification. Each set's full dependency closure (our packages plus the official,
# OpenWrt-signed feed packages they pull in) is resolved by build-offline-repo.sh.
#
# Format: a "[set-name]" header line, then one package name per line until the next header.
# Blank lines and '#' comments are ignored. verify-offline-install.sh installs a set by name
# (default: travelmate) and asserts the installed closure equals configs/packages.lock.

# Only top-level packages are listed. h5000m-modem-atd is deliberately absent: it is
# pulled in as a dependency of h5000m-fm350 and h5000m-lpac, so listing it separately
# would assert nothing extra.
#
# NOTE: the 'cellular' set is the only one whose closure contains kernel modules, so it
# is the only one bound to a kernel ABI. Its offline repo is valid ONLY for the exact
# image it was built against - see the kernel/kernel_abi header in configs/packages.lock.

[travelmate]
h5000m-travelmate-defaults

[cellular]
h5000m-fm350
luci-proto-fm350

[esim]
h5000m-lpac

[sms]
h5000m-sms

[tailscale]
h5000m-tailscale-defaults

[mwan3]
h5000m-mwan3-policy

[all]
h5000m-fm350
luci-proto-fm350
h5000m-lpac
h5000m-sms
h5000m-travelmate-defaults
h5000m-tailscale-defaults
h5000m-mwan3-policy
